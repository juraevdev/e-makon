# Staging/production stack for E-Makon: Postgres + Redis + API + nginx + Telegram bot.
# Does NOT include MyGarden. TLS is expected to terminate in front of nginx (or add certificates here).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emakon}
      POSTGRES_USER: ${POSTGRES_USER:-emakon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      DRF_NUM_PROXIES: "1"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - api
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      EMAKON_API_BASE_URL: http://api:8000/api/v1
      REDIS_URL: redis://redis:6379/0
      BOT_USE_REDIS: "true"
      BOT_ALLOW_MEMORY_FSM: "false"
      BOT_DATABASE_PATH: /app/bot_data/sessions.sqlite3
    volumes:
      - botdata:/app/bot_data
    depends_on:
      - api
      - redis
    command: python -m bot.main
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  static:
  botdata:
