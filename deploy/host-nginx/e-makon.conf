# Host nginx (TLS terminator) in front of the docker stack and pm2 panels.
#   cp deploy/host-nginx/e-makon.conf /etc/nginx/sites-available/e-makon
#   ln -s /etc/nginx/sites-available/e-makon /etc/nginx/sites-enabled/e-makon
#   certbot --nginx -d e-makon.uz -d www.e-makon.uz -d api.e-makon.uz -d superadmin.e-makon.uz -d admin.e-makon.uz

map $http_upgrade $emakon_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name e-makon.uz www.e-makon.uz;
    return 301 https://superadmin.e-makon.uz$request_uri;
}

server {
    listen 80;
    server_name api.e-makon.uz;
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name superadmin.e-makon.uz;

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $emakon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.e-makon.uz;

    location / {
        proxy_pass http://127.0.0.1:8112;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $emakon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
