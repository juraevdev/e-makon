# Host nginx (TLS terminator) in front of the docker stack (127.0.0.1:8110) and pm2 panels (8111/8112).
#   cp deploy/host-nginx/e-makon.conf /etc/nginx/sites-available/e-makon
#   ln -sf /etc/nginx/sites-available/e-makon /etc/nginx/sites-enabled/e-makon
#   nginx -t && systemctl reload nginx
# Certificate (first time only, before the 443 blocks exist):
#   certbot certonly --nginx --cert-name e-makon.uz -d e-makon.uz -d www.e-makon.uz \
#       -d api.e-makon.uz -d superadmin.e-makon.uz -d admin.e-makon.uz
# Panels call the API on their own origin (/api/), so they don't depend on api.e-makon.uz DNS or CORS.

map $http_upgrade $emakon_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name e-makon.uz www.e-makon.uz api.e-makon.uz superadmin.e-makon.uz admin.e-makon.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name e-makon.uz www.e-makon.uz;
    ssl_certificate /etc/letsencrypt/live/e-makon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-makon.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://superadmin.e-makon.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name api.e-makon.uz;
    ssl_certificate /etc/letsencrypt/live/e-makon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-makon.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name superadmin.e-makon.uz;
    ssl_certificate /etc/letsencrypt/live/e-makon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-makon.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 60m;

    location ~ ^/(api|media|static)/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $emakon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin.e-makon.uz;
    ssl_certificate /etc/letsencrypt/live/e-makon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-makon.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 60m;

    location ~ ^/(api|media|static)/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8112;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $emakon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
